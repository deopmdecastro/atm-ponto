databases:
  - name: atm-ponto-db
    plan: free
    databaseName: atm
    user: atm

services:
  - type: web
    name: atm-ponto-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: atm-ponto-api-disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atm-ponto-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: CORS_ORIGIN
        value: https://atm-ponto.vercel.app
      - key: REGISTRATION_ENABLED
        value: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
